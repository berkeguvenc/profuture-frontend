<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Profuture</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Header -->
    <header class="header-wrapper sticky-top">
        <div class="top-bar">
            <div class="container-fluid d-flex justify-content-between align-items-center pe-5 h-100">
                <div class="top-left d-flex align-items-center gap-2">
                    <i class="icon icon-message"></i>
                    <span>profuture@gmail.com</span>
                </div>

                <div class="top-right d-flex align-items-center gap-3">
                    <div class="info-item">
                        <span class="label">ISSN:</span> <span class="value">2145-2151</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Başlangıç:</span> <span class="value">2022</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Periyot:</span> <span class="value">Yılda 2 Sayı</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-header">
            <div class="header-inner d-flex align-items-center h-100 container-fluid">
                <div class="logo-area">
                    <a href="index.html">
                        <img src="assets/images/logo.png" alt="Profuture" class="logo-img">
                    </a>
                </div>

                <nav class="main-nav d-none d-lg-block flex-grow-1">
                    <ul class="nav-list d-flex list-unstyled m-0 justify-content-end pe-4">
                        <li><a href="#" class="nav-link">Amaç ve Kapsam</a></li>
                        <li><a href="#" class="nav-link">Etik İlkeler</a></li>
                        <li><a href="#" class="nav-link">Makale Çağrısı</a></li>
                        <li><a href="#" class="nav-link">Sayılar</a></li>
                        <li><a href="#" class="nav-link">İletişim</a></li>
                    </ul>
                </nav>

                <div class="header-actions d-none d-lg-flex align-items-center gap-3 pe-4">
                    <button class="btn btn-primary btn-kurul">
                        <i class="icon icon-kurul"></i>
                        <span>Dergi Kurulu</span>
                    </button>
                    <button class="btn btn-primary btn-author">
                        <i class="icon icon-author"></i>
                        <span>Yazar Rehberi</span>
                    </button>
                    <button class="btn btn-circle btn-search">
                        <i class="icon icon-search"></i>
                    </button>
                </div>

                <button class="btn btn-mobile-toggle d-lg-none ms-auto" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#mobileMenu">
                    <i class="icon icon-menu"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="offcanvas offcanvas-end d-lg-none" tabindex="-1" id="mobileMenu" style="z-index: 1060;">
        <div class="offcanvas-header border-bottom">
            <h4 class="offcanvas-title">Menü</h4>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav flex-column gap-3 mb-4">
                <li><a href="#" class="nav-link text-dark">Amaç ve Kapsam</a></li>
                <li><a href="#" class="nav-link text-dark">Etik İlkeler</a></li>
                <li><a href="#" class="nav-link text-dark">Makale Çağrısı</a></li>
                <li><a href="#" class="nav-link text-dark">Sayılar</a></li>
                <li><a href="#" class="nav-link text-dark">İletişim</a></li>
            </ul>
            <div class="d-grid gap-3">
                <button class="btn btn-primary btn-kurul">
                    <i class="icon icon-kurul"></i>
                    <span>Dergi Kurulu</span>
                </button>
                <button class="btn btn-primary btn-author">
                    <i class="icon icon-author"></i>
                    <span>Yazar Rehberi</span>
                </button>
                <button class="btn btn-circle btn-search">
                    <i class="icon icon-search"></i>
                </button>
            </div>
        </div>
    </div>

    <main style="min-height: 200vh; padding-top: 20px;">
        <div class="container">
            <p>Sayfa</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
